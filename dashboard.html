<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre - La Lumière de l'Ange Zeïna</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen relative">

<nav class="bg-slate-800 p-4 shadow-md flex justify-between items-center">
    <div class="font-bold text-xl">Zeïna - Matériel</div>
    <button id="logout-btn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm transition duration-200">
        Se déconnecter
    </button>
</nav>

<main class="p-8 max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">

    <div class="col-span-1 bg-slate-800 p-6 rounded-xl border border-slate-700 h-fit">
        <h2 class="text-xl font-bold mb-4">Ajouter un matériel</h2>
        <form id="add-item-form" class="space-y-4">
            <div>
                <label for="item-name" class="block text-sm font-medium text-slate-300 mb-1">Type de matériel</label>
                <input type="text" id="item-name" placeholder="Ex: Fauteuil roulant..." class="w-full px-3 py-2 bg-slate-700 text-white border border-slate-600 rounded-lg focus:outline-none focus:border-blue-500" required>
            </div>
            <div>
                <label for="item-ref" class="block text-sm font-medium text-slate-300 mb-1">Référence / Numéro</label>
                <input type="text" id="item-ref" placeholder="Ex: FR-01" class="w-full px-3 py-2 bg-slate-700 text-white border border-slate-600 rounded-lg focus:outline-none focus:border-blue-500" required>
            </div>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
                Enregistrer l'équipement
            </button>
        </form>
    </div>

    <div class="col-span-1 md:col-span-2 bg-slate-800 p-6 rounded-xl border border-slate-700">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <h2 class="text-xl font-bold">Inventaire</h2>
            <div class="flex space-x-2 bg-slate-900 p-1 rounded-lg border border-slate-700">
                <button id="filter-all" class="px-4 py-1.5 text-sm font-semibold rounded-md bg-slate-700 text-white shadow transition">Tous</button>
                <button id="filter-available" class="px-4 py-1.5 text-sm font-semibold rounded-md text-slate-400 hover:text-white transition">Disponibles</button>
                <button id="filter-loaned" class="px-4 py-1.5 text-sm font-semibold rounded-md text-slate-400 hover:text-white transition">En prêt</button>
            </div>
        </div>

        <div id="inventory-list" class="space-y-3">
            <!-- Les équipements apparaîtront ici -->
        </div>
    </div>

</main>

<!-- Fenêtre Modale pour le Prêt -->
<div id="loan-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-md max-h-[90vh] overflow-y-auto">
        <h2 class="text-xl font-bold mb-4">Nouveau Prêt</h2>
        <p id="modal-item-name" class="text-blue-400 font-semibold mb-4"></p>

        <form id="loan-form" class="space-y-4">
            <div>
                <label for="loan-date" class="block text-sm font-medium text-slate-300 mb-1">Date du prêt</label>
                <input type="date" id="loan-date" class="w-full px-3 py-2 bg-slate-700 text-white border border-slate-600 rounded-lg" required>
            </div>
            <div>
                <label for="member-name" class="block text-sm font-medium text-slate-300 mb-1">Bénévole effectuant le prêt</label>
                <input type="text" id="member-name" placeholder="Ex: Yannek" class="w-full px-3 py-2 bg-slate-700 text-white border border-slate-600 rounded-lg" required>
            </div>
            <div>
                <label for="patient-id" class="block text-sm font-medium text-slate-300 mb-1">N° de pièce d'identité du malade</label>
                <input type="text" id="patient-id" placeholder="N° CNI ou Passeport" class="w-full px-3 py-2 bg-slate-700 text-white border border-slate-600 rounded-lg" required>
            </div>
            <div>
                <label for="patient-name" class="block text-sm font-medium text-slate-300 mb-1">Nom et Prénom du malade</label>
                <input type="text" id="patient-name" class="w-full px-3 py-2 bg-slate-700 text-white border border-slate-600 rounded-lg" required>
            </div>
            <div>
                <label for="patient-phone" class="block text-sm font-medium text-slate-300 mb-1">Numéro de téléphone</label>
                <input type="tel" id="patient-phone" class="w-full px-3 py-2 bg-slate-700 text-white border border-slate-600 rounded-lg" required>
            </div>
            <div>
                <label for="patient-dob" class="block text-sm font-medium text-slate-300 mb-1">Date de naissance</label>
                <input type="date" id="patient-dob" class="w-full px-3 py-2 bg-slate-700 text-white border border-slate-600 rounded-lg" required>
            </div>
            <div>
                <label for="loan-duration" class="block text-sm font-medium text-slate-300 mb-1">Durée prévue</label>
                <select id="loan-duration" class="w-full px-3 py-2 bg-slate-700 text-white border border-slate-600 rounded-lg">
                    <option value="Courte">Courte durée (< 30 jours)</option>
                    <option value="Longue">Longue durée (> 30 jours)</option>
                </select>
            </div>
            <div>
                <label for="equipment-photo" class="block text-sm font-medium text-slate-300 mb-1">Photo de l'état de sortie</label>
                <input type="file" id="equipment-photo" accept="image/*" capture="environment" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 disabled:opacity-50">
                <div class="mt-2 flex items-center">
                    <input type="checkbox" id="no-photo-loan" class="w-4 h-4 rounded bg-slate-700 border-slate-600 focus:ring-blue-500">
                    <label for="no-photo-loan" class="ml-2 text-sm text-slate-400">Pas de photo (ancien prêt papier)</label>
                </div>
            </div>
            <div class="flex space-x-3 pt-4">
                <button type="button" id="close-modal-btn" class="flex-1 bg-slate-600 hover:bg-slate-700 text-white py-2 rounded-lg">Annuler</button>
                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg">Valider le prêt</button>
            </div>
        </form>
    </div>
</div>

<!-- Fenêtre Modale pour le Retour -->
<div id="return-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-md">
        <h2 class="text-xl font-bold mb-4">Retour de matériel</h2>
        <p id="return-modal-item-name" class="text-green-400 font-semibold mb-4"></p>

        <form id="return-form" class="space-y-4">
            <div>
                <label for="return-photo" class="block text-sm font-medium text-slate-300 mb-1">Photo de l'état de retour</label>
                <input type="file" id="return-photo" accept="image/*" capture="environment" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-green-600 file:text-white hover:file:bg-green-700 disabled:opacity-50">
                <div class="mt-2 flex items-center">
                    <input type="checkbox" id="no-photo-return" class="w-4 h-4 rounded bg-slate-700 border-slate-600 focus:ring-green-500">
                    <label for="no-photo-return" class="ml-2 text-sm text-slate-400">Pas de photo possible</label>
                </div>
            </div>
            <div class="flex space-x-3 pt-4">
                <button type="button" id="close-return-modal-btn" class="flex-1 bg-slate-600 hover:bg-slate-700 text-white py-2 rounded-lg">Annuler</button>
                <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-lg">Valider le retour</button>
            </div>
        </form>
    </div>
</div>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
