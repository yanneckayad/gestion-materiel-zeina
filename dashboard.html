<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre - La Lumière de l'Ange Zeïna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-pop-in { animation: popIn 0.3s ease-out forwards; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen relative selection:bg-blue-500/30">

<nav class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-800 p-4 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="font-black text-2xl flex items-center gap-3 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent tracking-tight">
            <i class="fa-solid fa-hand-holding-medical text-blue-500"></i> Zeïna
        </div>
        <button id="logout-btn" class="bg-slate-800 hover:bg-red-600/20 text-slate-300 hover:text-red-400 border border-slate-700 hover:border-red-500/50 px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-300 flex items-center gap-2">
            <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">Déconnexion</span>
        </button>
    </div>
</nav>

<main class="p-4 sm:p-8 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">

    <!-- Formulaire d'ajout -->
    <div class="col-span-1 bg-slate-800/50 backdrop-blur-sm p-6 rounded-2xl border border-slate-700 shadow-xl h-fit hover:border-slate-600 transition-colors duration-300">
        <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-white">
            <i class="fa-solid fa-box-open text-blue-400"></i> Nouveau matériel
        </h2>
        <form id="add-item-form" class="space-y-5">
            <div>
                <label for="item-name" class="block text-sm font-medium text-slate-400 mb-1">Type de matériel</label>
                <div class="relative">
                    <i class="fa-solid fa-wheelchair absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" id="item-name" placeholder="Ex: Fauteuil roulant..." class="w-full pl-10 pr-3 py-2.5 bg-slate-900/50 text-white border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all" required>
                </div>
            </div>
            <div>
                <label for="item-ref" class="block text-sm font-medium text-slate-400 mb-1">Référence / Numéro</label>
                <div class="relative">
                    <i class="fa-solid fa-hashtag absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" id="item-ref" placeholder="Ex: FR-01" class="w-full pl-10 pr-3 py-2.5 bg-slate-900/50 text-white border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all" required>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus"></i> Enregistrer
            </button>
        </form>
    </div>

    <!-- Inventaire -->
    <div class="col-span-1 lg:col-span-2 bg-slate-800/50 backdrop-blur-sm p-6 rounded-2xl border border-slate-700 shadow-xl">

        <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-8 gap-4">
            <h2 class="text-xl font-bold flex items-center gap-2 text-white whitespace-nowrap">
                <i class="fa-solid fa-clipboard-list text-emerald-400"></i> Inventaire
            </h2>

            <div class="flex flex-col sm:flex-row w-full xl:w-auto gap-3">
                <!-- Barre de recherche -->
                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" id="search-bar" placeholder="Rechercher (nom, réf...)" class="w-full pl-9 pr-3 py-2 bg-slate-900/80 text-white border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all text-sm">
                </div>

                <!-- Boutons de filtrage (Ajout du filtre En panne) -->
                <div class="flex space-x-1 bg-slate-900/80 p-1.5 rounded-xl border border-slate-700 w-full sm:w-auto overflow-x-auto">
                    <button id="filter-all" class="flex-1 sm:flex-none px-4 py-1.5 text-sm font-semibold rounded-lg bg-slate-700 text-white shadow-md transition-all"><i class="fa-solid fa-layer-group mr-1.5"></i>Tous</button>
                    <button id="filter-available" class="flex-1 sm:flex-none px-4 py-1.5 text-sm font-semibold rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-all"><i class="fa-solid fa-check mr-1.5"></i>Dispos</button>
                    <button id="filter-loaned" class="flex-1 sm:flex-none px-4 py-1.5 text-sm font-semibold rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-all"><i class="fa-solid fa-hand-holding-heart mr-1.5"></i>Prêtés</button>
                    <button id="filter-repair" class="flex-1 sm:flex-none px-4 py-1.5 text-sm font-semibold rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-all"><i class="fa-solid fa-screwdriver-wrench mr-1.5"></i>En panne</button>
                </div>
            </div>
        </div>

        <div id="inventory-list" class="space-y-4">
            <div class="animate-pulse flex items-center justify-center py-10 text-slate-500 gap-3">
                <i class="fa-solid fa-spinner fa-spin text-xl"></i> Récupération des données...
            </div>
        </div>
    </div>

</main>

<!-- Fenêtres modales existantes (aucun changement) -->
<!-- Fenêtre Modale pour le Prêt -->
<div id="loan-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity">
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto animate-pop-in">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-file-signature text-blue-400"></i> Nouveau Prêt</h2>
            <button id="close-modal-icon-btn" class="text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div class="bg-blue-500/10 border border-blue-500/20 rounded-xl p-3 mb-6">
            <p id="modal-item-name" class="text-blue-400 font-semibold text-center text-lg"></p>
        </div>
        <form id="loan-form" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="loan-date" class="block text-sm font-medium text-slate-400 mb-1"><i class="fa-regular fa-calendar mr-1"></i> Date du prêt</label>
                    <input type="date" id="loan-date" class="w-full px-3 py-2 bg-slate-900/50 text-white border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500/50" required>
                </div>
                <div>
                    <label for="member-name" class="block text-sm font-medium text-slate-400 mb-1"><i class="fa-solid fa-user-nurse mr-1"></i> Bénévole</label>
                    <input type="text" id="member-name" placeholder="Ton nom" class="w-full px-3 py-2 bg-slate-900/50 text-white border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500/50" required>
                </div>
            </div>
            <hr class="border-slate-700 my-4">
            <div>
                <label for="patient-id" class="block text-sm font-medium text-slate-400 mb-1"><i class="fa-regular fa-id-card mr-1"></i> N° Pièce d'identité</label>
                <input type="text" id="patient-id" placeholder="N° CNI ou Passeport" class="w-full px-3 py-2 bg-slate-900/50 text-white border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500/50" required>
            </div>
            <div>
                <label for="patient-name" class="block text-sm font-medium text-slate-400 mb-1"><i class="fa-solid fa-user-injured mr-1"></i> Nom du malade</label>
                <input type="text" id="patient-name" class="w-full px-3 py-2 bg-slate-900/50 text-white border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500/50" required>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="patient-phone" class="block text-sm font-medium text-slate-400 mb-1"><i class="fa-solid fa-phone mr-1"></i> Téléphone</label>
                    <input type="tel" id="patient-phone" class="w-full px-3 py-2 bg-slate-900/50 text-white border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500/50" required>
                </div>
                <div>
                    <label for="patient-dob" class="block text-sm font-medium text-slate-400 mb-1"><i class="fa-solid fa-cake-candles mr-1"></i> Naissance</label>
                    <input type="date" id="patient-dob" class="w-full px-3 py-2 bg-slate-900/50 text-white border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500/50" required>
                </div>
            </div>
            <div>
                <label for="loan-duration" class="block text-sm font-medium text-slate-400 mb-1"><i class="fa-solid fa-stopwatch mr-1"></i> Durée prévue</label>
                <select id="loan-duration" class="w-full px-3 py-2 bg-slate-900/50 text-white border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500/50">
                    <option value="Courte">Courte durée (< 30 jours)</option>
                    <option value="Longue">Longue durée (> 30 jours)</option>
                </select>
            </div>
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                <label for="equipment-photo" class="block text-sm font-medium text-slate-300 mb-2"><i class="fa-solid fa-camera mr-1"></i> Photo de l'état de sortie</label>
                <input type="file" id="equipment-photo" accept="image/*" capture="environment" class="w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 disabled:opacity-50 transition-all">
                <div class="mt-3 flex items-center bg-slate-800 p-2 rounded-lg border border-slate-700">
                    <input type="checkbox" id="no-photo-loan" class="w-4 h-4 rounded bg-slate-900 border-slate-600 text-blue-500 focus:ring-blue-500 focus:ring-offset-slate-800">
                    <label for="no-photo-loan" class="ml-2 text-sm text-slate-300 cursor-pointer">Pas de photo (ancien prêt papier)</label>
                </div>
            </div>
            <div class="flex space-x-3 pt-4">
                <button type="button" id="close-modal-btn" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 rounded-xl transition-colors">Annuler</button>
                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/25 hover:-translate-y-0.5 transition-all">Valider le prêt</button>
            </div>
        </form>
    </div>
</div>

<!-- Fenêtre Modale pour le Retour -->
<div id="return-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity">
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl w-full max-w-md animate-pop-in">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-truck-ramp-box text-emerald-400"></i> Retour matériel</h2>
            <button id="close-return-icon-btn" class="text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div class="bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-3 mb-6">
            <p id="return-modal-item-name" class="text-emerald-400 font-semibold text-center text-lg"></p>
        </div>
        <form id="return-form" class="space-y-4">
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                <label for="return-photo" class="block text-sm font-medium text-slate-300 mb-2"><i class="fa-solid fa-camera mr-1"></i> Photo de l'état de retour</label>
                <input type="file" id="return-photo" accept="image/*" capture="environment" class="w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 disabled:opacity-50 transition-all">
                <div class="mt-3 flex items-center bg-slate-800 p-2 rounded-lg border border-slate-700">
                    <input type="checkbox" id="no-photo-return" class="w-4 h-4 rounded bg-slate-900 border-slate-600 text-emerald-500 focus:ring-emerald-500 focus:ring-offset-slate-800">
                    <label for="no-photo-return" class="ml-2 text-sm text-slate-300 cursor-pointer">Pas de photo possible</label>
                </div>
            </div>
            <div class="flex space-x-3 pt-4">
                <button type="button" id="close-return-modal-btn" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 rounded-xl transition-colors">Annuler</button>
                <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/25 hover:-translate-y-0.5 transition-all">Valider le retour</button>
            </div>
        </form>
    </div>
</div>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
