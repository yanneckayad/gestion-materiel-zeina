<!DOCTYPE html>
<html lang="fr">
<!-- NOUVEAU : Configuration PWA (Application Native) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeïna">
<link rel="apple-touch-icon" href="icon.png">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - La Lumière de l'Ange Zeïna</title>
    <!-- Script pour charger Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

<div class="bg-slate-800 p-8 rounded-xl shadow-lg w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-white mb-2">La Lumière de l'Ange Zeïna</h1>
        <p class="text-slate-400">Gestion du matériel médical</p>
    </div>

    <form id="login-form" class="space-y-6">
        <div>
            <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Adresse Email</label>
            <input type="email" id="email" class="w-full px-4 py-2 bg-slate-700 text-white border border-slate-600 rounded-lg focus:outline-none focus:border-blue-500" required>
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Mot de passe</label>
            <input type="password" id="password" class="w-full px-4 py-2 bg-slate-700 text-white border border-slate-600 rounded-lg focus:outline-none focus:border-blue-500" required>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
            Se connecter
        </button>
    </form>
</div>
<script type="module" src="js/auth.js"></script>
<script>
    // Enregistrement du Service Worker pour la PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('PWA activée !'))
                .catch(err => console.log('Erreur PWA :', err));
        });
    }
</script>
</body>
</html>
