<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapports - La Lumière de l'Ange Zeïna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Zeïna">

    <!-- LIBRAIRIE POUR LE TÉLÉCHARGEMENT PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @media print {
            #sidebar, nav, #form-dates, #btn-print, #btn-download-pdf { display: none !important; }
            body { background: white !important; color: black !important; }
            .glass-card { background: white !important; border: 1px solid #ccc !important; color: black !important; backdrop-filter: none; box-shadow: none; }
            .text-white { color: black !important; }
            .text-slate-400, .text-slate-300 { color: #555 !important; }
            .bg-slate-900 { background: #f0f0f0 !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen relative selection:bg-purple-500/30 animate-fade-in">

<nav class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-800 p-4 shadow-lg flex justify-between items-center">
    <div class="flex items-center gap-3">
        <button id="menu-btn" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 active:scale-90 text-slate-200 border border-slate-700 rounded-xl flex items-center justify-center transition-all">
            <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <div class="font-black text-xl sm:text-2xl flex items-center gap-2 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent tracking-tight animate-gradient-text">
            <i class="fa-solid fa-hand-holding-medical text-blue-500"></i> Zeïna
        </div>
    </div>
    <a href="parametres.html" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 active:scale-90 text-slate-300 rounded-xl flex items-center justify-center border border-slate-700 transition-all duration-200 shadow-sm">
        <i class="fa-solid fa-gear"></i>
    </a>
</nav>

<div id="sidebar-backdrop" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 transition-opacity"></div>
<aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-slate-800 border-r border-slate-700 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col p-6 shadow-2xl">
    <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
        <div class="font-black text-xl text-white flex items-center gap-2 animate-gradient-text bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
            <i class="fa-solid fa-shield-halved text-blue-500"></i> Menu
        </div>
        <button id="close-sidebar" class="text-slate-400 hover:text-white active:scale-90 p-2">
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>
    </div>

    <div class="space-y-2 flex-grow">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-700/60 hover:text-white hover:translate-x-1 font-medium transition-all">
            <i class="fa-solid fa-wheelchair w-5 text-blue-400"></i> Gestion Matériel
        </a>
        <a href="medicaments.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-700/60 hover:text-white hover:translate-x-1 font-medium transition-all">
            <i class="fa-solid fa-pills w-5 text-emerald-400"></i> Gestion Pharmacie
        </a>
        <a href="rapport.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-purple-600 text-white font-semibold shadow-lg shadow-purple-500/20 btn-glow-purple transition-all">
            <i class="fa-solid fa-chart-pie w-5"></i> Rapports d'activité
        </a>
        <a href="parametres.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-700/60 hover:text-white hover:translate-x-1 font-medium transition-all">
            <i class="fa-solid fa-gear w-5 text-slate-400"></i> Paramètres
        </a>
    </div>

    <div class="border-t border-slate-700 pt-6 mt-4 space-y-4">
        <button id="logout-sidebar-btn" class="w-full bg-red-500/10 hover:bg-red-600 active:scale-95 text-red-400 hover:text-white border border-red-500/20 px-4 py-3 rounded-xl text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2">
            <i class="fa-solid fa-right-from-bracket"></i> Déconnexion
        </button>
        <div class="text-xs text-slate-500 text-center">Zeïna v2.4</div>
    </div>
</aside>

<main class="p-4 sm:p-8 max-w-6xl mx-auto">

    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
        <h2 class="text-2xl font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-purple-400 animate-float"></i> Rapport d'activité
        </h2>
        <div class="flex flex-wrap gap-3 w-full md:w-auto">
            <button id="btn-print" onclick="window.print()" class="flex-1 md:flex-none bg-slate-800 hover:bg-slate-700 active:scale-95 text-white border border-slate-600 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-print"></i> Imprimer
            </button>
            <!-- NOUVEAU BOUTON PDF -->
            <button id="btn-download-pdf" class="flex-1 md:flex-none bg-purple-600 hover:bg-purple-500 active:scale-95 text-white shadow-lg btn-glow-purple px-4 py-2.5 rounded-xl text-sm font-semibold transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-file-pdf"></i> Télécharger PDF
            </button>
        </div>
    </div>

    <div id="form-dates" class="glass-card p-6 rounded-2xl mb-8">
        <form id="report-form" class="flex flex-col md:flex-row gap-4 items-end">
            <div class="flex-1 w-full">
                <label class="block text-sm font-medium text-slate-400 mb-1">Du (Date de début)</label>
                <input type="date" id="date-debut" class="w-full px-3 py-2.5 bg-slate-900/50 text-white border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-500/50" required>
            </div>
            <div class="flex-1 w-full">
                <label class="block text-sm font-medium text-slate-400 mb-1">Au (Date de fin)</label>
                <input type="date" id="date-fin" class="w-full px-3 py-2.5 bg-slate-900/50 text-white border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-500/50" required>
            </div>
            <button type="submit" class="w-full md:w-auto bg-purple-600 hover:bg-purple-500 active:scale-95 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg btn-glow-purple transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-magnifying-glass"></i> Analyser
            </button>
        </form>
    </div>

    <!-- ZONE À EXPORTER EN PDF -->
    <div id="report-content" class="space-y-8 pb-4">

        <div class="flex justify-between items-center mb-2 px-2 hidden" id="pdf-header">
            <h3 class="font-bold text-white text-xl">Rapport Zeïna</h3>
            <p class="text-sm text-slate-400" id="pdf-dates-display"></p>
        </div>

        <!-- Les 4 cartes de statistiques -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass-card p-5 rounded-2xl text-center hover:-translate-y-1">
                <i class="fa-solid fa-hand-holding-heart text-2xl text-blue-400 mb-2"></i>
                <p class="text-3xl font-bold text-white" id="stat-prets">0</p>
                <p class="text-xs text-slate-400 uppercase tracking-wide mt-1">Matériels Prêtés</p>
            </div>
            <div class="glass-card p-5 rounded-2xl text-center hover:-translate-y-1">
                <i class="fa-solid fa-boxes-packing text-2xl text-emerald-400 mb-2"></i>
                <p class="text-3xl font-bold text-white" id="stat-retours">0</p>
                <p class="text-xs text-slate-400 uppercase tracking-wide mt-1">Matériels Rendus</p>
            </div>
            <div class="glass-card p-5 rounded-2xl text-center hover:-translate-y-1">
                <i class="fa-solid fa-pills text-2xl text-amber-400 mb-2"></i>
                <p class="text-3xl font-bold text-white" id="stat-dons">0</p>
                <p class="text-xs text-slate-400 uppercase tracking-wide mt-1">Médicaments Donnés</p>
            </div>
            <div class="glass-card p-5 rounded-2xl text-center hover:-translate-y-1">
                <i class="fa-solid fa-boxes-stacked text-2xl text-purple-400 mb-2"></i>
                <p class="text-3xl font-bold text-white" id="stat-ajouts">0</p>
                <p class="text-xs text-slate-400 uppercase tracking-wide mt-1">Médicaments Reçus</p>
            </div>
        </div>

        <!-- Journal Détaillé -->
        <div class="glass-card p-6 rounded-2xl">
            <h3 class="text-lg font-bold text-white mb-6 border-b border-slate-700 pb-3"><i class="fa-solid fa-list-ul mr-2"></i> Journal détaillé des opérations</h3>

            <div class="relative border-l border-slate-700 ml-3 space-y-6" id="report-timeline">
                <p class="pl-6 text-slate-500 italic">Sélectionnez des dates pour générer le rapport.</p>
            </div>
        </div>

    </div>
    <!-- FIN ZONE PDF -->

</main>

<script>
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    const closeSidebar = document.getElementById('close-sidebar');
    function toggleMenu() { sidebar.classList.toggle('-translate-x-full'); backdrop.classList.toggle('hidden'); }
    menuBtn.addEventListener('click', toggleMenu);
    closeSidebar.addEventListener('click', toggleMenu);
    backdrop.addEventListener('click', toggleMenu);
</script>
<script type="module" src="js/rapport.js?v=2.4"></script>
</body>
</html>
