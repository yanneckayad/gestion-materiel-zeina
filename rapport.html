<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapports - La Lumière de l'Ange Zeïna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Zeïna">

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        /* Cacher la sidebar à l'impression */
        @media print {
            #sidebar, nav, #form-dates, #btn-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .bg-slate-800 { background: white !important; border: 1px solid #ccc !important; color: black !important; }
            .text-white { color: black !important; }
            .text-slate-400 { color: #555 !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen relative selection:bg-purple-500/30">

<nav class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-800 p-4 shadow-lg flex justify-between items-center">
    <div class="flex items-center gap-3">
        <button id="menu-btn" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl flex items-center justify-center transition-all">
            <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <div class="font-black text-xl sm:text-2xl flex items-center gap-2 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent tracking-tight">
            <i class="fa-solid fa-hand-holding-medical text-blue-500"></i> Zeïna
        </div>
    </div>
    <button id="logout-btn" class="bg-slate-800 hover:bg-red-600/20 text-slate-300 hover:text-red-400 border border-slate-700 hover:border-red-500/50 px-3.5 py-2 rounded-xl text-sm font-semibold transition-all flex items-center gap-2">
        <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">Déconnexion</span>
    </button>
</nav>

<div id="sidebar-backdrop" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 transition-opacity"></div>
<aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-slate-800 border-r border-slate-700 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between p-6 shadow-2xl">
    <div>
        <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <div class="font-black text-xl text-white flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-blue-500"></i> Menu Zeïna
            </div>
            <button id="close-sidebar" class="text-slate-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="space-y-2">
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-700/60 hover:text-white font-medium transition-all">
                <i class="fa-solid fa-wheelchair w-5 text-blue-400"></i> Gestion Matériel
            </a>
            <a href="medicaments.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-700/60 hover:text-white font-medium transition-all">
                <i class="fa-solid fa-pills w-5 text-emerald-400"></i> Gestion Pharmacie
            </a>
            <a href="rapport.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-purple-600 text-white font-semibold shadow-lg shadow-purple-500/20 transition-all">
                <i class="fa-solid fa-chart-pie w-5"></i> Rapports d'activité
            </a>
        </div>
    </div>
    <div class="border-t border-slate-700 pt-4 text-xs text-slate-500 text-center">
        La Lumière de l'Ange Zeïna v2.0
    </div>
</aside>

<main class="p-4 sm:p-8 max-w-6xl mx-auto animate-fade-in">

    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
        <h2 class="text-2xl font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-purple-400"></i> Rapport d'activité
        </h2>
        <button id="btn-print" onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 text-white border border-slate-600 px-4 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2">
            <i class="fa-solid fa-print"></i> Imprimer
        </button>
    </div>

    <!-- Sélecteur de dates -->
    <div id="form-dates" class="bg-slate-800/50 backdrop-blur-sm p-6 rounded-2xl border border-slate-700 shadow-xl mb-8">
        <form id="report-form" class="flex flex-col md:flex-row gap-4 items-end">
            <div class="flex-1 w-full">
                <label class="block text-sm font-medium text-slate-400 mb-1">Du (Date de début)</label>
                <input type="date" id="date-debut" class="w-full px-3 py-2.5 bg-slate-900/50 text-white border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-500/50" required>
            </div>
            <div class="flex-1 w-full">
                <label class="block text-sm font-medium text-slate-400 mb-1">Au (Date de fin)</label>
                <input type="date" id="date-fin" class="w-full px-3 py-2.5 bg-slate-900/50 text-white border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-500/50" required>
            </div>
            <button type="submit" class="w-full md:w-auto bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-magnifying-glass"></i> Analyser
            </button>
        </form>
    </div>

    <!-- Les 4 cartes de statistiques -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700 shadow-lg text-center">
            <i class="fa-solid fa-hand-holding-heart text-2xl text-blue-400 mb-2"></i>
            <p class="text-3xl font-bold text-white" id="stat-prets">0</p>
            <p class="text-xs text-slate-400 uppercase tracking-wide mt-1">Matériels Prêtés</p>
        </div>
        <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700 shadow-lg text-center">
            <i class="fa-solid fa-boxes-packing text-2xl text-emerald-400 mb-2"></i>
            <p class="text-3xl font-bold text-white" id="stat-retours">0</p>
            <p class="text-xs text-slate-400 uppercase tracking-wide mt-1">Matériels Rendus</p>
        </div>
        <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700 shadow-lg text-center">
            <i class="fa-solid fa-pills text-2xl text-amber-400 mb-2"></i>
            <p class="text-3xl font-bold text-white" id="stat-dons">0</p>
            <p class="text-xs text-slate-400 uppercase tracking-wide mt-1">Médicaments Donnés</p>
        </div>
        <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700 shadow-lg text-center">
            <i class="fa-solid fa-boxes-stacked text-2xl text-purple-400 mb-2"></i>
            <p class="text-3xl font-bold text-white" id="stat-ajouts">0</p>
            <p class="text-xs text-slate-400 uppercase tracking-wide mt-1">Médicaments Reçus</p>
        </div>
    </div>

    <!-- Journal Détaillé -->
    <div class="bg-slate-800/50 backdrop-blur-sm p-6 rounded-2xl border border-slate-700 shadow-xl">
        <h3 class="text-lg font-bold text-white mb-6 border-b border-slate-700 pb-3"><i class="fa-solid fa-list-ul mr-2"></i> Journal détaillé des opérations</h3>

        <div class="relative border-l border-slate-700 ml-3 space-y-6" id="report-timeline">
            <p class="pl-6 text-slate-500 italic">Sélectionnez des dates pour générer le rapport.</p>
        </div>
    </div>

</main>

<script>
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    const closeSidebar = document.getElementById('close-sidebar');
    function toggleMenu() { sidebar.classList.toggle('-translate-x-full'); backdrop.classList.toggle('hidden'); }
    menuBtn.addEventListener('click', toggleMenu);
    closeSidebar.addEventListener('click', toggleMenu);
    backdrop.addEventListener('click', toggleMenu);
</script>
<script type="module" src="js/rapport.js"></script>
</body>
</html>
