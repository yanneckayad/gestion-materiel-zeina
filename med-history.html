<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique Médicament - Zeïna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen relative selection:bg-blue-500/30">

<nav class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-800 p-4 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="font-black text-2xl flex items-center gap-3 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent tracking-tight">
            <i class="fa-solid fa-hand-holding-medical text-blue-500"></i> Zeïna
        </div>
        <a href="medicaments.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-4 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Retour Pharmacie
        </a>
    </div>
</nav>

<main class="p-4 sm:p-8 max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 animate-fade-in">

    <!-- Fiche du médicament -->
    <div class="col-span-1 bg-slate-800/50 p-6 rounded-2xl border border-slate-700 shadow-xl h-fit flex flex-col items-center text-center">
        <div class="w-32 h-32 rounded-xl bg-slate-900 border border-slate-700 overflow-hidden mb-4 shadow-md">
            <img id="med-photo" src="" alt="Boîte" class="w-full h-full object-cover">
        </div>
        <h2 id="med-name" class="text-xl font-bold text-white mb-1"></h2>
        <p id="med-stock" class="text-sm font-mono text-slate-400 mb-4"></p>
        <div id="med-status"></div>
    </div>

    <!-- Timeline des mouvements -->
    <div class="col-span-1 md:col-span-2 bg-slate-800/50 p-6 rounded-2xl border border-slate-700 shadow-xl">
        <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-white">
            <i class="fa-solid fa-clock-rotate-left text-emerald-400"></i> Historique des mouvements
        </h2>

        <div class="relative border-l border-slate-700 ml-3 space-y-6" id="med-timeline">
            <div class="animate-pulse pl-6 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Chargement...
            </div>
        </div>
    </div>
</main>

<script type="module" src="js/med-history.js"></script>
</body>
</html>
